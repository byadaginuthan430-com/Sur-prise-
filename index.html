<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Birthday Surprise ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif;color:#fff}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#glitch{background:#020202;z-index:10;animation:exit .45s ease 1.85s forwards}
.noise{position:absolute;inset:-20%;background:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 4px);animation:noise .08s infinite}
.gt{font-size:clamp(28px,9vw,70px);font-weight:900;letter-spacing:4px;position:relative;animation:shake .11s infinite}
.gt:before,.gt:after{content:"SYSTEM ERROR";position:absolute;inset:0}
.gt:before{color:#ff1744;transform:translate(-4px,1px);clip-path:inset(0 0 55% 0)}
.gt:after{color:#00e5ff;transform:translate(4px,-1px);clip-path:inset(55% 0 0)}
.warn{position:absolute;bottom:12%;font-size:12px;letter-spacing:3px;opacity:.65}
#birthday{background:radial-gradient(circle at 50% 35%,#ff4f8b,#9b174c 28%,#27071a 68%,#070107);opacity:0;z-index:5;animation:show 1s ease 2s forwards}
.card{text-align:center;width:min(88vw,420px);z-index:2}
.photoWrap{width:min(78vw,330px);height:min(78vw,330px);margin:auto;border-radius:50%;padding:7px;background:linear-gradient(135deg,#fff,#ffb6d0,#fff);box-shadow:0 0 35px #ffb4dccc;animation:pop .8s 2.15s both}
.photo{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
h1{font:clamp(34px,10vw,54px) Georgia,serif;margin:8px 0;animation:rise .8s 2.35s both}
.msg{font-size:clamp(15px,4.3vw,19px);line-height:1.55;animation:rise .8s 2.55s both}
.heart{font-size:34px;animation:beat 1.1s infinite}
.conf{position:absolute;inset:0;overflow:hidden}
.conf i{position:absolute;top:-20px;width:8px;height:16px;animation:fall 3s linear infinite;transform:rotate(20deg)}
.conf i:nth-child(1){left:8%}.conf i:nth-child(2){left:18%;animation-delay:.3s}
.conf i:nth-child(3){left:29%;animation-delay:.1s}.conf i:nth-child(4){left:41%;animation-delay:.5s}
.conf i:nth-child(5){left:53%;animation-delay:.2s}.conf i:nth-child(6){left:65%;animation-delay:.4s}
.conf i:nth-child(7){left:77%}.conf i:nth-child(8){left:90%;animation-delay:.6s}
@keyframes noise{50%{transform:translate(3px,-2px)}}
@keyframes shake{25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}}
@keyframes exit{to{opacity:0;visibility:hidden}}
@keyframes show{to{opacity:1}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(25px);opacity:0}to{transform:none;opacity:1}}
@keyframes beat{50%{transform:scale(1.2)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<section id="glitch" class="screen">
<div class="noise"></div>
<div class="gt">SYSTEM ERROR</div>
<div class="warn">PLEASE WAIT... SURPRISE LOADING</div>
</section>

<section id="birthday" class="screen">
<div class="conf"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="card">
<div class="photoWrap"><img class="photo" src="birthday.jpg" alt="Birthday surprise"></div>
<div class="heart">❤️</div>
<h1>Happy Birthday!</h1>
<div class="msg">Wishing you a day filled with happiness, beautiful moments, and everything that makes you smile. ✨<br><br><b>You deserve all the happiness in the world. 💕</b></div>
</div>
</section>
</body>
</html>
